# ClientShield — production compose (Phase 6P1)
# Usage:
#   cp .env.example .env.production   # then set production secrets
#   docker compose -f compose.production.yaml --env-file .env.production up -d --build
#
# Does NOT bake secrets into the image. TLS certificates are mounted for nginx
# (not included in the repo). Redis is not required and is omitted.
#
# See DEPLOYMENT.md and PRODUCTION.md.

name: clientshield-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientshield}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - clientshield_prod_pgdata:/var/lib/postgresql/data
    networks:
      - clientshield_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-clientshield}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # Do not publish Postgres to the host in production by default.
    # Uncomment only for emergency admin access from the host:
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: clientshield:${BUILD_VERSION:-0.1.0}
    restart: unless-stopped
    command: ["app"]
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
    volumes:
      - clientshield_prod_reports:/app/storage/reports
    networks:
      - clientshield_internal
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: false
    # App HEALTHCHECK from Dockerfile probes GET /api/health
    expose:
      - "3001"

  wazuh-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: clientshield:${BUILD_VERSION:-0.1.0}
    restart: unless-stopped
    command: ["wazuh-worker"]
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
    networks:
      - clientshield_internal
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  sla-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: clientshield:${BUILD_VERSION:-0.1.0}
    restart: unless-stopped
    command: ["sla-worker"]
    env_file:
      - path: ${ENV_FILE:-.env.production}
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
    networks:
      - clientshield_internal
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Mount host TLS material (not committed). See nginx/certs/README.md
      - ${TLS_CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    networks:
      - clientshield_internal
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/nginx-health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  clientshield_internal:
    name: clientshield_prod_net
    driver: bridge

volumes:
  clientshield_prod_pgdata:
    name: clientshield_prod_pgdata
  clientshield_prod_reports:
    name: clientshield_prod_reports
