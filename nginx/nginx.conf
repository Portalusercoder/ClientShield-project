# ClientShield production nginx (Phase 6P1)
# HTTPS-ready. Certificates are mounted at runtime — none are committed.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # Large uploads (reports, attachments, evidence)
  client_max_body_size 50m;
  client_body_timeout 120s;

  # Compression (text responses)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Upstream ClientShield app (compose service name)
  upstream clientshield_app {
    server app:3001;
    keepalive 16;
  }

  include /etc/nginx/conf.d/*.conf;
}
