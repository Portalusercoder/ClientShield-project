# ClientShield reverse proxy
# Default: HTTP reverse proxy (works without certificates).
# HTTPS: copy conf.d/ssl.conf.example → conf.d/ssl.conf after mounting certs.
#
# Primary security headers (CSP, HSTS, COOP, CORP) are set by Next.js middleware.
# Nginx keeps a baseline defense-in-depth set. Do not duplicate CSP here
# (conflicting policies are hard to debug).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    proxy_pass http://clientshield_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering on;

    # Baseline only — full CSP/HSTS/COOP applied by the app middleware
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
